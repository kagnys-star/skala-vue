name: Deploy Vue to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint 오류가 있으면 배포하지 않고 여기서 멈춘다.
      - name: Lint
        run: npm run lint

      - name: Build Vue application
        run: npm run build
        env:
          # 로컬의 .env.local은 git에 올라가지 않으므로 CI에는 값이 없다.
          # 저장소 Settings > Secrets and variables > Actions 에 같은 이름으로 등록해야 한다.
          # 여기 나열하지 않은 키는 Secrets에 등록해 두었어도 빌드에 전달되지 않는다.
          # (실제로 TMDB 키가 이 목록에 없어서 빌드에는 전달되지 않은 채 배포된 적이 있다)
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
