name: Deploy Vue to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint 오류가 있으면 배포하지 않고 여기서 멈춘다.
      - name: Lint
        run: npm run lint

      - name: Build Vue application
        run: npm run build
        env:
          # 로컬의 .env.local은 git에 올라가지 않으므로 CI에는 값이 없다.
          # 저장소 Settings > Secrets and variables > Actions 에 같은 이름으로 등록해야 한다.
          # 등록하지 않으면 빌드는 성공하지만 배포된 화면에서 401 오류가 뜬다.
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
